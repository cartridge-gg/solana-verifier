[package]
name = "client"
version.workspace = true
edition.workspace = true

[dependencies]
borsh.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
solana-cli-config = "3.0.6"
solana-client = "3.0.6"
solana-instruction = "3.0.0"
solana-sdk = "3.0.0"
solana-system-interface.workspace = true
solana-loader-v3-interface = { version = "6.1.0", features = ["bincode"] }
solana-commitment-config = "3.0.0"
solana-compute-budget-interface = "3.0.0"
solana-keypair = "3.0.0"
solana-pubkey = "3.0.0"
thiserror.workspace = true
swiftness_proof_parser = { path = "../parser" }
utils.workspace = true
felt.workspace = true
solana-rpc-client = "3.0.6"
solana-rpc-client-api = "3.0.6"
tokio = "1.44.2"
futures = "0.3.31"
env_logger = {version = "0.11.6",features = ["unstable-kv"]}
log = {version = "0.4.22",features = ["kv"]}
types.workspace = true

# Only need types, not the full programs
verifier-1 = { workspace = true, features = ["no-entrypoint"] }
verifier-2 = { workspace = true, features = ["no-entrypoint"] }
verifier-3 = { workspace = true, features = ["no-entrypoint"] }
verifier-4 = { workspace = true, features = ["no-entrypoint"] }
validate-public-input.workspace = true
poseidon.workspace = true
pedersen.workspace = true
stark-commit.workspace = true
stark-verify-decommitments.workspace = true   
stark-verify-verification.workspace = true
stark-verify-fri.workspace = true
get-hash.workspace = true
verify-public-input.workspace = true
verify-1.workspace = true
verify-2.workspace = true
verify-3.workspace = true
verify-4.workspace = true
transcript.workspace = true