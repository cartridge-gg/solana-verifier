[workspace]
resolver = "2"
members = ["client", "programs/*", "tasks/*", "parser"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
borsh = "1.5.7"
solana-program = "2.2.1"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
thiserror = "2.0.12"
typetag = "0.2.20"
lambdaworks-math = "0.12.0"
num-bigint = "0.4.6"
size-of = "0.1.5"

client = { path = "./client" }

verifier = { path = "./programs/verifier" }
verifier-1 = { path = "./programs/verifier1" }

utils = { path = "./programs/utils" }
utils-1 = { path = "./programs/utils1" }


felt = { path = "./tasks/felt" }
stark = { path = "./tasks/stark" }
validate-public-input = { path = "./tasks/validate_public_input" }
poseidon = { path = "./tasks/poseidon" }
pedersen = { path = "./tasks/pedersen" }

types = { path = "./tasks/types" }